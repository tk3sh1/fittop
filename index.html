<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FitTop Studio</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #222222);
            --hint: var(--tg-theme-hint-color, #999999);
            --btn: var(--tg-theme-button-color, #3390ec);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --sec-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }

        body {
            font-family: -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 16px;
        }

        .card {
            background-color: var(--sec-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .card-desc { font-size: 14px; color: var(--hint); margin-bottom: 12px; }

        button {
            width: 100%; border: none; border-radius: 12px;
            padding: 12px; font-size: 16px; font-weight: 600;
            cursor: pointer;
        }

        .buy-btn { background-color: var(--btn); color: var(--btn-text); }
        .watch-btn { background-color: #4CAF50; color: white; }

        /* Модальное окно для видео */
        #videoModal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.95);
            z-index: 1000; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <div id="catalog">
        </div>

    <div id="videoModal">
        <button onclick="closeVideo()" style="position:absolute; top:20px; right:20px; width:40px;">✕</button>
        <div id="playerContainer" style="width:100%; aspect-ratio:16/9;"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // 1. Наш контент (база данных программ)
        const programs = [
            {
                id: 'abs_30',
                title: '🔥 Пресс за 30 дней',
                desc: 'Интенсивный курс для стального пресса.',
                price: '150 000 UZS',
                videoUrl: 'https://www.youtube.com/embed/dQw4w9WgXcQ' // Замени на свое
            },
            {
                id: 'back_health',
                title: '💪 Здоровая спина',
                desc: 'Упражнения для осанки и снятия боли.',
                price: '120 000 UZS',
                videoUrl: 'https://www.youtube.com/embed/3AtDnEC4zak'
            }
        ];

        // 2. Получаем список купленных программ из URL (?bought=abs_30,back_health)
        const urlParams = new URLSearchParams(window.location.search);
        const boughtData = urlParams.get('bought') || "";
        const boughtPrograms = boughtData.split(',');

        // 3. Функция отрисовки каталога
        function render() {
            const container = document.getElementById('catalog');
            container.innerHTML = '';

            programs.forEach(p => {
                const isBought = boughtPrograms.includes(p.id);
                
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-title">${p.title}</div>
                    <div class="card-desc">${p.desc}</div>
                    ${isBought 
                        ? `<button class="watch-btn" onclick="openVideo('${p.id}')">▶ Смотреть курс</button>`
                        : `<button class="buy-btn" onclick="buy('${p.id}')">Купить за ${p.price}</button>`
                    }
                `;
                container.appendChild(card);
            });
        }

        // 4. Действия
        function buy(id) {
            tg.sendData(JSON.stringify({program_id: id}));
        }

        function openVideo(id) {
            const p = programs.find(item => item.id === id);
            document.getElementById('playerContainer').innerHTML = `
                <iframe width="100%" height="100%" src="${p.videoUrl}" frameborder="0" allowfullscreen></iframe>
            `;
            document.getElementById('videoModal').style.display = 'flex';
        }

        function closeVideo() {
            document.getElementById('videoModal').style.display = 'none';
            document.getElementById('playerContainer').innerHTML = '';
        }

        render();
    </script>
</body>
</html>
