<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); margin: 0; padding: 20px; }
        .card { background: var(--tg-theme-secondary-bg-color); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #ccc; }
        h1 { font-size: 20px; text-align: center; }
        button { background: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); border: none; border-radius: 8px; padding: 10px 20px; width: 100%; cursor: pointer; font-weight: bold; }
        .price { font-weight: bold; color: #4CAF50; display: block; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Программы тренировок</h1>
    
    <div class="card">
        <h3>🔥 Интенсив: Пресс</h3>
        <p>30 дней до кубиков. Видео-инструкции включены.</p>
        <span class="price">1500 ₽</span>
        <button onclick="buyProgram('abs_30')">Купить доступ</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Расширяем на все окно

        function buyProgram(id) {
            // Отправляем данные боту
            tg.sendData(JSON.stringify({program_id: id}));
            tg.close(); // Закрываем Web App после выбора
        }
    </script>
</body>
</html>
