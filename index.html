<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FitTop Studio</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #222222);
            --hint: var(--tg-theme-hint-color, #999999);
            --btn: var(--tg-theme-button-color, #3390ec);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --sec-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 16px; }
        .card { background-color: var(--sec-bg); border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid rgba(0,0,0,0.05); }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .lesson-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; padding: 10px; background: var(--bg); border-radius: 10px; }
        button { border: none; border-radius: 10px; padding: 10px; font-weight: 600; cursor: pointer; }
        .buy-btn { width: 100%; background-color: var(--btn); color: var(--btn-text); }
        .watch-btn { background-color: #4CAF50; color: white; font-size: 12px; }
        #videoModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="catalog"></div>
    <div id="videoModal">
        <button onclick="closeVideo()" style="position:absolute; top:20px; right:20px; width:40px; background:white;">✕</button>
        <div id="playerContainer" style="width:100%; aspect-ratio:16/9;"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const programs = [{
            id: 'month_abs_pack',
            title: '🔥 Пресс за 30 дней',
            desc: 'Интенсивный курс для стального пресса.',
            lessons: [
                { id: 1, title: 'Урок 1: Разминка', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ' },
                { id: 2, title: 'Урок 2: Базовые скручивания', url: 'https://www.youtube.com/embed/3AtDnEC4zak' },
                { id: 3, title: 'Урок 3: Планка', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ' }
            ]
        }];

        const urlParams = new URLSearchParams(window.location.search);
        const boughtPrograms = (urlParams.get('bought') || "").split(',');
        const completedLessons = (urlParams.get('completed') || "").split(',').map(Number);

        function render() {
            const container = document.getElementById('catalog');
            container.innerHTML = '';

            programs.forEach(p => {
                const isBought = boughtPrograms.includes(p.id);
                let html = `<div class="card"><div class="card-title">${p.title}</div>`;

                if (isBought) {
                    p.lessons.forEach(lesson => {
                        const isDone = completedLessons.includes(lesson.id);
                        html += `
                            <div class="lesson-item">
                                <span style="${isDone ? 'text-decoration:line-through; color:gray;' : ''}">${isDone ? '✅' : '⚪️'} ${lesson.title}</span>
                                <div style="display:flex; gap:5px;">
                                    <button class="watch-btn" onclick="openVideo('${lesson.url}')">▶</button>
                                    ${!isDone ? `<button class="watch-btn" style="background:#3390ec;" onclick="markDone('${p.id}', ${lesson.id})">Готово</button>` : ''}
                                </div>
                            </div>`;
                    });
                } else {
                    html += `<p style="font-size:14px; color:gray;">${p.desc}</p>`;
                    html += `<button class="buy-btn" onclick="buy('${p.id}')">Купить за 150 000 UZS</button>`;
                }
                container.innerHTML += html + `</div>`;
            });
        }

        function buy(id) { tg.sendData(JSON.stringify({program_id: id})); }
        function markDone(pId, lId) {
            // Сохраняем в облако Telegram (лимит 1кб на ключ)
            const key = `progress_${pId}`;
            completedLessons.push(lId);
            
            tg.CloudStorage.setItem(key, completedLessons.join(','), (err, success) => {
                if (success) {
                    render(); // Обновляем UI без закрытия окна
                    tg.HapticFeedback.notificationOccurred('success'); // Вибрация "успех"
                }
            });
        }
        function openVideo(url) {
            document.getElementById('playerContainer').innerHTML = `<iframe width="100%" height="100%" src="${url}" frameborder="0" allowfullscreen></iframe>`;
            document.getElementById('videoModal').style.display = 'flex';
        }
        function closeVideo() {
            document.getElementById('videoModal').style.display = 'none';
            document.getElementById('playerContainer').innerHTML = '';
        }
        render();
    </script>
</body>
</html>
