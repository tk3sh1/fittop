<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FitTop Studio</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #222222);
            --hint: var(--tg-theme-hint-color, #999999);
            --btn: var(--tg-theme-button-color, #3390ec);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --sec-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 16px;
            display: flex; flex-direction: column; gap: 16px;
        }

        .header { text-align: center; margin-bottom: 8px; }
        .header h1 { font-size: 24px; margin: 0; }
        .header p { color: var(--hint); font-size: 14px; }

        .card {
            background-color: var(--sec-bg);
            border-radius: 16px;
            overflow: hidden;
            display: flex; flex-direction: column;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .card-content { padding: 16px; }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .card-desc { font-size: 14px; color: var(--hint); margin-bottom: 12px; line-height: 1.4; }
        
        .price-tag {
            font-size: 18px; font-weight: 800; color: var(--btn);
            margin-bottom: 12px; display: block;
        }

        .buy-btn {
            background-color: var(--btn);
            color: var(--btn-text);
            border: none; border-radius: 12px;
            padding: 12px; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: opacity 0.2s;
        }

        .buy-btn:active { opacity: 0.7; }
    </style>
</head>
<body>
    <div class="header">
        <h1>FitTop Studio</h1>
        <p>Выбери свой путь к идеальному телу</p>
    </div>

    <div class="card">
        <div class="card-content">
            <div class="card-title">🔥 Пресс за 30 дней</div>
            <div class="card-desc">Интенсивная программа для дома. Видео-уроки, техника упражнений и план питания.</div>
            <span class="price-tag">150 000 UZS</span>
            <button class="buy-btn" onclick="sendData('abs_30')">Купить доступ</button>
        </div>
    </div>

    <div class="card">
        <div class="card-content">
            <div class="card-title">💪 Крепкая спина</div>
            <div class="card-desc">Оздоровительный курс для тех, кто много работает за компьютером.</div>
            <span class="price-tag">120 000 UZS</span>
            <button class="buy-btn" onclick="sendData('back_health')">Купить доступ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function sendData(id) {
            tg.sendData(JSON.stringify({program_id: id}));
        }
    </script>
</body>
</html>
